[project]
name = "neoma-server"
version = "0.1.0"
description = "Neoma study OS API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "pg8000>=1.31",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "mcp>=2.2,<3",
    "jinja2>=3.1",
    "boto3>=1.35",
    "cryptography>=42",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "pyright>=1.1.400"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]   # FastAPI's dependency system lives in argument defaults

[tool.pyright]
include = ["app", "tests", "alembic"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
