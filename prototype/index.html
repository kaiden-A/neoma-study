<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Neoma — a study OS for group projects and personal notes. Shared task boards, deadline reminders, your study notes and one calendar on the home screen.">
<meta name="color-scheme" content="light dark">
<title>Neoma · Study OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171C1A'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23EFF1EC' stroke-width='1.2' opacity='.6'/%3E%3Cpath d='M16 7 A9 9 0 0 1 16 25 A4.6 9 0 0 0 16 7 Z' fill='%23E0B93F'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  /* Tailwind carries the same design tokens as the CSS layer, so utilities and
     components stay in one visual language. */
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          paper: 'var(--paper)',
          card: 'var(--card)',
          ink: 'var(--ink)',
          'ink-muted': 'var(--ink-muted)',
          rule: 'var(--rule)',
          rail: 'var(--rail)',
          danger: 'var(--danger)',
          'mark-amber': 'var(--mark-amber)',
          'mark-mint': 'var(--mark-mint)',
          'mark-sky': 'var(--mark-sky)',
          'mark-coral': 'var(--mark-coral)',
          'mark-violet': 'var(--mark-violet)',
          'mark-pink': 'var(--mark-pink)'
        },
        fontFamily: {
          display: ['Fraunces', 'Georgia', 'serif'],
          sans: ['"IBM Plex Sans"', 'system-ui', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace']
        },
        borderRadius: { card: '14px', control: '10px' }
      }
    }
  };
</script>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<a class="nm-skip" href="#view">Skip to content</a>

<div class="nm-shell">
  <aside class="nm-rail" aria-label="Primary">
    <a class="nm-brand" href="#/today">
      <span class="nm-brand-mark" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 32 32"><circle cx="16" cy="16" r="9.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5"/><path d="M16 6.5 A9.5 9.5 0 0 1 16 25.5 A4.9 9.5 0 0 0 16 6.5 Z" fill="currentColor"/></svg>
      </span>
      <span class="nm-brand-name nm-mono">NEOMA</span>
    </a>

    <nav class="nm-nav" aria-label="Sections">
      <a class="nm-navitem" data-route="today" href="#/today"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Home</span></a>
      <a class="nm-navitem" data-route="groups" href="#/groups"><i class="fa-solid fa-users" aria-hidden="true"></i><span>Groups</span></a>
      <a class="nm-navitem" data-route="vault" href="#/vault"><i class="fa-solid fa-note-sticky" aria-hidden="true"></i><span>Notes</span></a>
      <a class="nm-navitem" data-route="calendar" href="#/calendar"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i><span>Calendar</span></a>
    </nav>

    <div class="nm-rail-bottom">
      <div class="nm-railnext" data-rail-next></div>
      <a class="nm-navitem nm-navitem--sm" data-route="settings" href="#/settings">
        <i class="fa-solid fa-sliders" aria-hidden="true"></i><span>Settings</span>
      </a>
      <button type="button" class="nm-avatar-btn" data-avatar aria-label="Account"></button>
    </div>
  </aside>

  <div class="nm-body">
    <header class="nm-topbar">
      <a href="#/today" class="nm-topbar-brand nm-mono md:hidden">NEOMA</a>
      <button type="button" class="nm-searchbtn" data-palette-open aria-label="Open command palette">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <span class="nm-searchbtn-text">Search tasks, notes, groups…</span>
        <kbd class="nm-kbd" data-kbd-hint>Ctrl K</kbd>
      </button>
      <div class="flex items-center gap-1.5">
        <button type="button" class="nm-iconbtn" data-mobile-capture aria-label="Quick capture"><i class="fa-solid fa-feather-pointed" aria-hidden="true"></i></button>
        <button type="button" class="nm-iconbtn nm-bellbtn" data-bell aria-label="Notifications">
          <i class="fa-solid fa-bell" aria-hidden="true"></i><span class="nm-badge" data-bell-badge hidden>0</span>
        </button>
      </div>
    </header>

    <main id="view" class="nm-view" tabindex="-1"></main>
  </div>
</div>

<nav class="nm-tabbar" aria-label="Sections">
  <a class="nm-tabitem" data-route="today" href="#/today"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Home</span></a>
  <a class="nm-tabitem" data-route="groups" href="#/groups"><i class="fa-solid fa-users" aria-hidden="true"></i><span>Groups</span></a>
  <a class="nm-tabitem" data-route="vault" href="#/vault"><i class="fa-solid fa-note-sticky" aria-hidden="true"></i><span>Notes</span></a>
  <a class="nm-tabitem" data-route="calendar" href="#/calendar"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i><span>Calendar</span></a>
  <a class="nm-tabitem" data-route="settings" href="#/settings"><i class="fa-solid fa-sliders" aria-hidden="true"></i><span>Settings</span></a>
</nav>

<div id="toasts" class="nm-toasts" aria-live="polite"></div>
<div id="overlays"></div>
<p id="route-announce" class="nm-sr" aria-live="polite"></p>

<script src="assets/js/util.js"></script>
<script src="assets/js/files.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/notify.js"></script>
<script src="assets/js/ics.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/palette.js"></script>
<script src="assets/js/taskmodal.js"></script>
<script src="assets/js/router.js"></script>
<script src="assets/js/pages/dashboard.js"></script>
<script src="assets/js/pages/groups.js"></script>
<script src="assets/js/pages/group.js"></script>
<script src="assets/js/pages/todo.js"></script>
<script src="assets/js/pages/vault.js"></script>
<script src="assets/js/pages/note.js"></script>
<script src="assets/js/pages/calendar.js"></script>
<script src="assets/js/pages/notifications.js"></script>
<script src="assets/js/pages/settings.js"></script>
<script src="assets/js/pages/join.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
