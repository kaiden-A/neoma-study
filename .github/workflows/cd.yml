name: CD Pipeline

on:
  push:
    branches:
      - master
    paths:
      - 'server/**'
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.APP_NAME }}
  GCP_REGION: asia-southeast1
  CLOUD_RUN_SERVICE: ${{ vars.APP_NAME }}

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set image tag to short commit SHA
      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # 3. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push Docker image
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ env.DOCKERHUB_IMAGE }}:latest

      # 5. Cloud Run pulls Docker Hub images through mirror.gcr.io. A tag
      # pushed seconds ago can still 404 there while Docker Hub has it, so wait
      # for the immutable digest the build just produced and deploy that.
      - name: Wait for the registry mirror
        run: |
          image="${DOCKERHUB_IMAGE#docker.io/}"
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "::error::The build did not report an image digest"
            exit 1
          fi
          # Buildx emits an OCI image index when provenance is on. Ask for every
          # media type we might have produced: a Docker-v2-only Accept header
          # makes the mirror 404 even when the digest is already available.
          for attempt in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
              "https://mirror.gcr.io/v2/${image}/manifests/${digest}")
            if [ "$code" = "200" ]; then
              echo "Mirror is serving ${image}@${digest} (attempt ${attempt})"
              exit 0
            fi
            echo "Mirror returned ${code} for ${image}@${digest}; retrying in 10s"
            sleep 10
          done
          echo "::error::Mirror did not serve ${image}@${digest} within 3 minutes"
          exit 1

      # 6. Authenticate to GCP
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 7. Deploy to Cloud Run
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.DOCKERHUB_IMAGE }}@${{ steps.build.outputs.digest }}

      # 8. Print the deployed URL
      - name: Show deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
